<title>Comet Gravity</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&family=JetBrains+Mono:wght@400&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Exo 2',sans-serif;height:100dvh;width:100vw}
canvas#game{display:block;width:100vw;height:100dvh}

/* UI Overlay */
#ui{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
#topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;pointer-events:auto}
.tb-col{display:flex;flex-direction:column;gap:2px}
.tb-level{font-family:'Orbitron',monospace;color:#7df9ff;font-size:13px;font-weight:700;text-shadow:0 0 10px rgba(125,249,255,0.5);letter-spacing:2px}
.tb-sub{font-family:'Exo 2',sans-serif;color:rgba(255,255,255,0.4);font-size:11px}
.tb-stars{font-size:16px;letter-spacing:3px}
.tb-score{font-family:'Orbitron',monospace;color:#ffd700;font-size:13px;font-weight:700;text-shadow:0 0 10px rgba(255,215,0,0.5)}
#hint{position:fixed;bottom:50px;left:0;width:100%;text-align:center;font-size:13px;color:rgba(255,255,255,0.35);pointer-events:none;z-index:11;transition:opacity .5s}

/* Overlays base */
.ov{position:fixed;top:0;left:0;width:100%;height:100%;display:none;justify-content:center;align-items:center;flex-direction:column;z-index:20}
.ov.show{display:flex}

.m-title{font-family:'Orbitron',monospace;font-size:30px;font-weight:900;color:#7df9ff;text-shadow:0 0 30px rgba(125,249,255,0.5),0 0 60px rgba(125,249,255,0.2);letter-spacing:4px}
.m-sub{font-family:'Orbitron',monospace;font-size:12px;color:rgba(255,255,255,0.4);letter-spacing:6px;text-transform:uppercase;margin-bottom:40px;margin-top:4px}

/* Buttons */
.btn{font-family:'Orbitron',monospace;border:none;padding:13px 28px;font-size:12px;font-weight:700;letter-spacing:2px;cursor:pointer;border-radius:4px;margin:5px;transition:all .15s;text-transform:uppercase;-webkit-tap-highlight-color:transparent}
.btn:active{transform:scale(.95)}
.btn-p{background:linear-gradient(135deg,#7df9ff,#00b4d8);color:#0a0a12;box-shadow:0 0 20px rgba(125,249,255,0.25)}
.btn-s{background:rgba(255,255,255,0.08);color:#7df9ff;border:1px solid rgba(125,249,255,0.25)}
.btn-d{background:linear-gradient(135deg,#f87171,#dc2626);color:#fff}
.btn-g{background:linear-gradient(135deg,#4ade80,#16a34a);color:#0a0a12}
.btn-w{background:linear-gradient(135deg,#fbbf24,#d97706);color:#0a0a12}
.btn-sm{padding:8px 14px;font-size:10px;letter-spacing:1px}

/* Win/Lose overlay */
#msgov{background:rgba(5,5,15,0.85);backdrop-filter:blur(8px)}
#msg-title{font-family:'Orbitron',monospace;font-size:26px;font-weight:900;letter-spacing:3px;margin-bottom:8px}
#msg-sub{font-size:15px;color:rgba(255,255,255,0.6);margin-bottom:6px}
#msg-stars{font-size:34px;margin-bottom:20px;letter-spacing:8px}
#msg-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* Level select */
#levsel{z-index:25;background:radial-gradient(ellipse at center,#0d1b2a,#0a0a12 70%);padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
#levsel.show{display:flex;flex-direction:column}
#levsel-inner{padding:16px;padding-top:10px;padding-bottom:30px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
#levsel-title{font-family:'Orbitron',monospace;font-size:18px;color:#7df9ff;letter-spacing:3px;margin:16px 0 8px;text-align:center}
.dbg-lv{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:3px 0;background:rgba(255,255,255,0.04);border:1px solid rgba(125,249,255,0.1);border-radius:6px;transition:all .15s}
.dbg-lv.dragging{opacity:0.4;border-color:#fbbf24}
.dbg-lv.dragover{border-color:#7df9ff;background:rgba(125,249,255,0.08)}
.dbg-num{font-family:'Orbitron',monospace;font-size:12px;color:rgba(255,255,255,0.4);min-width:28px;text-align:center}
.dbg-info{flex:1;display:flex;flex-direction:column;gap:2px}
.dbg-name{font-size:12px;color:#7df9ff}
.dbg-det{font-size:9px;color:rgba(255,255,255,0.35)}
.dbg-dots{display:flex;gap:2px;flex-wrap:wrap}
.dbg-dot{width:8px;height:8px;border-radius:50%}
.dbg-acts{display:flex;gap:4px;flex-shrink:0}
.dbg-acts button{width:28px;height:28px;border:none;border-radius:4px;background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.5);font-size:12px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dbg-acts button:active{transform:scale(.9)}
.dbg-grip{cursor:grab;font-size:14px;color:rgba(255,255,255,0.25);padding:0 4px;touch-action:none}
.zone-label{font-family:'Orbitron',monospace;font-size:11px;color:rgba(255,255,255,0.5);letter-spacing:2px;margin:16px 0 8px 4px;display:flex;align-items:center;gap:8px}
.zone-label .dot{width:10px;height:10px;border-radius:50%}
#levgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:340px;margin:0 auto 20px}
.lv-btn{aspect-ratio:1;border:1px solid rgba(125,249,255,0.15);background:rgba(255,255,255,0.04);border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;font-family:'Orbitron',monospace;color:#7df9ff;font-size:15px;font-weight:700;transition:all .15s}
.lv-btn.locked{opacity:.25;pointer-events:none;color:rgba(255,255,255,0.3)}
.lv-btn.disco{border-color:#ffd700;background:rgba(255,215,0,0.1);animation:pulse-gold 1.5s infinite}
.lv-btn.current{border-color:#7df9ff;background:rgba(125,249,255,0.12);box-shadow:0 0 12px rgba(125,249,255,0.2)}
.lv-btn:active{transform:scale(.9)}
.lv-stars{font-size:7px;margin-top:3px}
@keyframes pulse-gold{0%,100%{box-shadow:0 0 5px rgba(255,215,0,0.2)}50%{box-shadow:0 0 15px rgba(255,215,0,0.4)}}

/* Discovery overlay */
#discovery{z-index:28;background:rgba(5,5,15,0.92);backdrop-filter:blur(10px)}
#disco-planet{width:80px;height:80px;border-radius:50%;margin-bottom:16px}
#disco-name{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;letter-spacing:3px;margin-bottom:8px}
#disco-desc{font-size:14px;color:rgba(255,255,255,0.6);text-align:center;max-width:300px;line-height:1.6;margin-bottom:6px}
#disco-rule{font-family:'JetBrains Mono',monospace;font-size:12px;color:#fbbf24;text-align:center;max-width:280px;margin-bottom:20px}
#disco-visual{width:200px;height:200px;margin-bottom:20px;position:relative}
#disco-canvas{width:200px;height:200px}

/* Editor overlay */
#editor{z-index:26;background:#080810;flex-direction:column;padding:0}
#ed-toolbar{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,0.5);border-bottom:1px solid rgba(125,249,255,0.1);flex-shrink:0}
#ed-canvas-wrap{flex:1;position:relative;overflow:hidden}
#ed-canvas{display:block;width:100%;height:100%}
#ed-tools{display:flex;flex-wrap:nowrap;padding:5px 6px;gap:4px;background:rgba(0,0,0,0.6);border-top:1px solid rgba(125,249,255,0.1);overflow-x:scroll;overflow-y:hidden;flex-shrink:0;align-items:center;-webkit-overflow-scrolling:touch;min-height:42px;scrollbar-width:none}
#ed-tools::-webkit-scrollbar{display:none}
.t-btn{flex-shrink:0;width:36px;min-width:36px;height:36px;border-radius:7px;border:2px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.04);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.t-btn.active{border-color:#7df9ff;background:rgba(125,249,255,0.12);box-shadow:0 0 10px rgba(125,249,255,0.2)}
.t-btn:active{transform:scale(.92)}
.t-dot{width:14px;height:14px;border-radius:50%}
.t-lbl{font-size:6.5px;color:rgba(255,255,255,0.5);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.t-sep{width:1px;height:28px;background:rgba(255,255,255,0.08);flex-shrink:0;margin:0 3px}
#ed-props{display:none;padding:8px 12px;background:rgba(0,0,0,0.7);border-top:1px solid rgba(125,249,255,0.12);flex-shrink:0}
#ed-props.show{display:block}
#ed-props h4{font-family:'Orbitron',monospace;font-size:10px;color:#7df9ff;letter-spacing:1px;margin-bottom:8px}
.pr{display:flex;align-items:center;margin-bottom:6px}
.pr-l{font-size:11px;color:rgba(255,255,255,0.5);min-width:60px}
.pr-sw{flex:1;display:flex;align-items:center;gap:6px;margin-left:8px}
.pr-s{flex:1;-webkit-appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,0.12);outline:none}
.pr-s::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#7df9ff;cursor:pointer}
.pr-v{font-family:'JetBrains Mono',monospace;font-size:10px;color:#7df9ff;min-width:30px;text-align:right}

/* Code export */
#codeov{z-index:35;background:rgba(5,5,15,0.95);flex-direction:column;padding:0}
#code-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid rgba(125,249,255,0.12);flex-shrink:0}
#code-head h3{font-family:'Orbitron',monospace;font-size:13px;color:#7df9ff;letter-spacing:2px}
#code-body{flex:1;overflow-y:auto;padding:10px;-webkit-overflow-scrolling:touch}
#code-out{font-family:'JetBrains Mono',monospace;font-size:10px;line-height:1.5;color:#a0f0a0;background:rgba(0,0,0,0.5);border:1px solid rgba(125,249,255,0.1);border-radius:6px;padding:12px;white-space:pre-wrap;word-break:break-all;user-select:text;-webkit-user-select:text}
#code-foot{padding:10px 16px;border-top:1px solid rgba(125,249,255,0.12);display:flex;gap:8px;justify-content:center;flex-shrink:0}

::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(125,249,255,0.15);border-radius:2px}
</style>

<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="topbar">
    <div class="tb-col"><div class="tb-level" id="tb-lv">NIVEAU 1</div><div class="tb-sub" id="tb-launches">Lancers: 0</div></div>
    <div class="tb-stars" id="tb-stars">⭐⭐⭐</div>
    <div class="tb-col" style="align-items:flex-end"><div class="tb-score" id="tb-score">0</div><div id="topbar-btns" style="display:flex;gap:4px;margin-top:4px;pointer-events:auto"></div></div>
  </div>
</div>
<div id="hint">Glissez pour lancer la comète ☄️</div>

<!-- Menu -->
<div id="menu" class="ov show" style="justify-content:flex-end;padding-bottom:env(safe-area-inset-bottom,20px)">
  <div style="margin-bottom:30px;display:flex;flex-direction:column;align-items:center">
    <button class="btn btn-p" onclick="startPlay()">JOUER</button>
    <button class="btn btn-s" style="margin-top:6px" onclick="startLevelSelect()">NIVEAUX</button>
    <button class="btn btn-w" style="margin-top:6px" onclick="startDebug()">🛠 DÉBUG</button>
  </div>
</div>

<!-- Win/Lose -->
<div id="msgov" class="ov">
  <div id="msg-title"></div>
  <div id="msg-sub"></div>
  <div id="msg-stars"></div>
  <div id="msg-btns"></div>
</div>

<!-- Level Select -->
<div id="levsel" class="ov">
  <div id="levsel-inner"></div>
</div>

<!-- Discovery -->
<div id="discovery" class="ov">
  <div id="disco-planet"></div>
  <div id="disco-name"></div>
  <div id="disco-desc"></div>
  <div id="disco-rule"></div>
  <canvas id="disco-canvas" width="200" height="200"></canvas>
  <button class="btn btn-p" onclick="closeDiscovery()" style="margin-top:16px">COMPRIS !</button>
</div>

<!-- Editor -->
<div id="editor" class="ov">
  <div id="ed-toolbar">
    <div style="display:flex;align-items:center;gap:8px">
      <button class="btn btn-sm btn-s" onclick="closeEditor()">← RETOUR</button>
      <span id="ed-name" style="font-family:'Orbitron',monospace;font-size:11px;color:#7df9ff;letter-spacing:1px">Niveau</span>
    </div>
    <div>
      <button class="btn btn-sm btn-g" onclick="testFromEditor()">▶ TEST</button>
      <button class="btn btn-sm btn-p" onclick="saveFromEditor()">💾</button>
    </div>
  </div>
  <div id="ed-canvas-wrap"><canvas id="ed-canvas"></canvas></div>
  <div id="ed-props"><h4 id="ep-title">PROPRIÉTÉS</h4><div id="ep-content"></div></div>
  <div id="ed-tools"></div>
</div>

<!-- Code Export -->
<div id="codeov" class="ov">
  <div id="code-head"><h3>CODE NIVEAUX</h3><button class="btn btn-sm btn-s" onclick="hideCode()">FERMER</button></div>
  <div id="code-body"><pre id="code-out"></pre></div>
  <div id="code-foot"><button class="btn btn-sm btn-p" onclick="copyCode()">📋 COPIER</button></div>
</div>

// Charger les niveaux modifiés depuis localStorage (écrase les hardcodés si plus récents)
function loadCustomLevels(){
  try{
    // D'abord vérifier s'il y a une sauvegarde complète (avec réordonnancement/ajouts)
    const allData=JSON.parse(localStorage.getItem('cg_all_levels'));
    if(allData&&allData._count){
      const count=allData._count;
      LEVELS.length=0;
      for(let i=0;i<count;i++){
        if(allData[i]) LEVELS.push(allData[i]);
      }
      return; // cg_all_levels est prioritaire
    }
  }catch(e){}
  try{
    // Sinon charger les modifs individuelles
    const data=JSON.parse(localStorage.getItem('cg_custom_levels'));
    if(data){
      for(const key in data){
        const i=parseInt(key);
        if(i>=0&&i<LEVELS.length){
          const hadDisco=LEVELS[i].d;
          const hadDt=LEVELS[i].dt;
          LEVELS[i]=data[key];
          if(hadDisco&&!LEVELS[i].d){LEVELS[i].d=hadDisco;LEVELS[i].dt=hadDt;}
        }
      }
    }
  }catch(e){}
}
loadCustomLevels();

function loadLevel(idx){
  if(idx>=LEVELS.length) idx=LEVELS.length-1;
  const lv=LEVELS[idx];
  G.level=idx; G.launches=0; G.win=false; G.flying=false; G.playing=true; G.menu=false;
  
  comet.x=lv.comet.x*W; comet.y=lv.comet.y*H;
  comet.vx=0; comet.vy=0; comet.trail=[]; comet.alive=true; comet.nm=0;
  blackHole.x=lv.blackHole.x*W; blackHole.y=lv.blackHole.y*H;
  
  planets=lv.planets.map(p=>({
    x:p.x*W, y:p.y*H,
    size:p.size*SC, type:p.type,
    strength:p.strength,
    origSize:p.size,
    pp:Math.random()*Math.PI*2, rp:0,
    pulsarAngle:0,
    moonAngle:Math.random()*Math.PI*2
  }));
  wormholes=(lv.wormholes||[]).map(w=>({x1:w.x1*W,y1:w.y1*H,x2:w.x2*W,y2:w.y2*H,cd:0}));
  
  particles=[];
  updateUI();
  document.getElementById('hint').style.opacity=(idx<3&&idx<128)?'1':'0';
  
  // Check for discovery
  if(lv.d && lv.dt && !localStorage.getItem('cg_disco_'+lv.dt)){
    showDiscovery(lv.dt);
  }
  if(typeof updateTopbarButtons==='function')updateTopbarButtons();
}

function resetComet(){
  const lv=LEVELS[G.level];
  comet.x=lv.comet.x*W; comet.y=lv.comet.y*H;
  comet.vx=0; comet.vy=0; comet.trail=[]; comet.alive=true; comet.nm=0;
  for(const w of wormholes) w.cd=0;
  G.flying=false;
}

function showDiscovery(type){
  const ov=document.getElementById('discovery');
  const isWormhole=type==='wormhole';
  const info=isWormhole?{main:'#d8b4fe',name:'Trou de Ver',desc:'Deux portails liés dans l\'espace.\nLa comète entre dans l\'un et ressort par l\'autre — dans les deux sens !'}:PT[type];
  document.getElementById('disco-planet').style.background=isWormhole?'radial-gradient(circle at 35% 35%, #fff, #7c3aed)':`radial-gradient(circle at 35% 35%, #fff, ${info.main})`;
  document.getElementById('disco-name').textContent=info.name;
  document.getElementById('disco-name').style.color=info.main;
  document.getElementById('disco-desc').textContent=info.desc;
  document.getElementById('disco-rule').textContent=isWormhole?'🌀 Bidirectionnel — vitesse conservée à la sortie !':'⚡ Plus la planète est petite, plus son effet est puissant !';
  
  // Animate discovery canvas
  const dc=document.getElementById('disco-canvas');
  const dx=dc.getContext('2d');
  dc.width=200*devicePixelRatio; dc.height=200*devicePixelRatio;
  dx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  
  let dTime=0;
  let dBall={x:40,y:160,vx:1.5,vy:-2.5};
  const dPlanet={x:100,y:90,size:20};
  
  function animDisco(){
    if(!ov.classList.contains('show')) return;
    dTime++;
    dx.clearRect(0,0,200,200);
    
    // BG
    dx.fillStyle='rgba(10,10,18,0.3)';
    dx.fillRect(0,0,200,200);
    
    // Planet
    if(!isWormhole){
    if(dType==='pulsar'&&pulsarCoreImgReady){dx.drawImage(pulsarCoreImg,dPlanet.x-dPlanet.size,dPlanet.y-dPlanet.size,dPlanet.size*2,dPlanet.size*2);}else{const pg=dx.createRadialGradient(dPlanet.x-5,dPlanet.y-5,3,dPlanet.x,dPlanet.y,dPlanet.size);
    pg.addColorStop(0,'#fff'); pg.addColorStop(0.4,info.main); pg.addColorStop(1,shadeColor(info.main,-40));
    dx.beginPath(); dx.arc(dPlanet.x,dPlanet.y,dPlanet.size,0,Math.PI*2);
    dx.fillStyle=pg; dx.fill();}
    }
    
    // Physics demo
    const ddx=dPlanet.x-dBall.x, ddy=dPlanet.y-dBall.y;
    const ddist=Math.sqrt(ddx*ddx+ddy*ddy);
    const df=80/(ddist*ddist);
    
    if(isWormhole){
      // Wormhole demo: ball teleports between two portals
      const wA={x:50,y:140},wB={x:150,y:60};
      dBall.x+=dBall.vx;dBall.y+=dBall.vy;dBall.vy+=0.03;
      const da=Math.sqrt((dBall.x-wA.x)*(dBall.x-wA.x)+(dBall.y-wA.y)*(dBall.y-wA.y));
      const db=Math.sqrt((dBall.x-wB.x)*(dBall.x-wB.x)+(dBall.y-wB.y)*(dBall.y-wB.y));
      if(da<12){dBall.x=wB.x;dBall.y=wB.y;}
      if(db<12){dBall.x=wA.x;dBall.y=wA.y;}
      if(dBall.x<-10||dBall.x>210||dBall.y<-10||dBall.y>210){dBall={x:20,y:100,vx:1.5,vy:-1};}
      // Draw portals
      [wA,wB].forEach((wp,wi)=>{
        if(wormholeCoreImgReady){dx.save();dx.translate(wp.x,wp.y);dx.rotate(dTime*0.02);dx.beginPath();dx.arc(0,0,14,0,Math.PI*2);dx.clip();dx.drawImage(wormholeCoreImg,-14,-14,28,28);dx.restore();}else{const wg=dx.createRadialGradient(wp.x,wp.y,0,wp.x,wp.y,12);wg.addColorStop(0,'#fff');wg.addColorStop(0.4,'#d8b4fe');wg.addColorStop(1,'rgba(124,58,237,0.3)');dx.beginPath();dx.arc(wp.x,wp.y,13,0,Math.PI*2);dx.fillStyle=wg;dx.fill();}
        dx.save();dx.translate(wp.x,wp.y);dx.rotate(dTime*0.02*(wi?-1:1));
        dx.beginPath();dx.ellipse(0,0,18,7,0,0,Math.PI*2);dx.strokeStyle='rgba(200,180,255,0.3)';dx.lineWidth=1;dx.stroke();
        dx.restore();
      });
      // Link
      dx.beginPath();dx.setLineDash([3,5]);dx.moveTo(wA.x,wA.y);dx.lineTo(wB.x,wB.y);dx.strokeStyle='rgba(168,85,247,0.15)';dx.lineWidth=1;dx.stroke();dx.setLineDash([]);
    }else{
    if(type==='repulsive'){dBall.vx-=(ddx/ddist)*df;dBall.vy-=(ddy/ddist)*df;}
    else{dBall.vx+=(ddx/ddist)*df;dBall.vy+=(ddy/ddist)*df;}
    if(type==='accelerator'&&ddist<60){dBall.vx*=1.01;dBall.vy*=1.01;}
    if(type==='slow'&&ddist<60){dBall.vx*=0.99;dBall.vy*=0.99;}
    if(type==='orbital'){dBall.vx+=(ddx/ddist)*df*0.5;dBall.vy+=(ddy/ddist)*df*0.5;}
    
    dBall.x+=dBall.vx; dBall.y+=dBall.vy;
    
    // Reset if out of bounds or stuck
    if(dBall.x<-10||dBall.x>210||dBall.y<-10||dBall.y>210||ddist<dPlanet.size+4){
      dBall={x:30+Math.random()*20,y:155+Math.random()*10,vx:1.2+Math.random()*0.8,vy:-2-Math.random()*1};
    }
    }
    
    // Ball
    const bg=dx.createRadialGradient(dBall.x-1,dBall.y-1,1,dBall.x,dBall.y,5);
    bg.addColorStop(0,'#fff'); bg.addColorStop(0.5,'#7df9ff'); bg.addColorStop(1,'#00b4d8');
    dx.beginPath(); dx.arc(dBall.x,dBall.y,5,0,Math.PI*2);
    dx.fillStyle=bg; dx.fill();
    
    // Effect visualization
    if(type==='repulsive'){
      for(let r=0;r<2;r++){
        const rr=dPlanet.size+5+((dTime*0.8+r*12)%25);
        const ra=1-((dTime*0.8+r*12)%25)/25;
        dx.beginPath();dx.arc(dPlanet.x,dPlanet.y,rr,0,Math.PI*2);
        dx.strokeStyle=`rgba(248,113,113,${ra*0.5})`;dx.lineWidth=1;dx.stroke();
      }
    }
    if(type==='orbital'){
      dx.beginPath();dx.arc(dPlanet.x,dPlanet.y,dPlanet.size+10,0,Math.PI*2);
      dx.strokeStyle='rgba(192,132,252,0.3)';dx.lineWidth=0.8;dx.setLineDash([3,3]);dx.stroke();dx.setLineDash([]);
    }
    
    requestAnimationFrame(animDisco);
  }
  
  ov.classList.add('show');
  animDisco();
}

function showPlayLevelGrid(inner){
  const zones=[

    {name:'Zone 2 — Boost',color:'#38bdf8',start:10,end:20},
    {name:'Zone 3 — Répulsion',color:'#f87171',start:20,end:30},
    {name:'Zone 4 — Orbite',color:'#c084fc',start:30,end:40},
    {name:'Zone 5 — Ralentissement',color:'#fbbf24',start:40,end:50},
    {name:'Zone 6 — Mélange',color:'#7df9ff',start:50,end:60},
    {name:'Zone 7 — Difficile',color:'#f97316',start:60,end:70},
    {name:'Zone 8 — Expert',color:'#ec4899',start:70,end:80},
    {name:'Zone 9 — Maître',color:'#ef4444',start:80,end:90},
    {name:'Zone 10 — Insane',color:'#dc2626',start:90,end:108},
    {name:'Zone 11 — Trous de Ver',color:'#d8b4fe',start:108,end:128},
    {name:'Zone 12 — Puzzle',color:'#a855f7',start:128,end:195},
  ];
  
  let html=`<div id="levsel-title">NIVEAUX</div>`;
  for(const z of zones){
    if(z.start>=LEVELS.length) break;
    const end=Math.min(z.end,LEVELS.length);
    html+=`<div class="zone-label"><div class="dot" style="background:${z.color}"></div>${z.name}</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:340px;margin:0 auto 10px">`;
    for(let i=z.start;i<end;i++){
      const disco=LEVELS[i]&&LEVELS[i].d;
      const st=G.stars[i]||0;
      const cls=(disco?'disco ':'')+(i===G.level?'current':'');
      html+=`<div class="lv-btn ${cls}" onclick="pickLevel(${i})">
        ${disco?'💡':(i+1)}
        <div class="lv-stars">${st?'⭐'.repeat(st):''}</div>
      </div>`;
    }
    html+=`</div>`;
  }
  // Si plus de niveaux que les zones, afficher le reste
  const lastZoneEnd=zones[zones.length-1].end;
  if(LEVELS.length>lastZoneEnd){
    html+=`<div class="zone-label"><div class="dot" style="background:#fff"></div>Niveaux ajoutés</div><div style="display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:340px;margin:0 auto 10px">`;
    for(let i=lastZoneEnd;i<LEVELS.length;i++){
      html+=`<div class="lv-btn" onclick="pickLevel(${i})">${i+1}<div class="lv-stars"></div></div>`;
    }
    html+=`</div>`;
  }
  html+=`<div style="display:flex;gap:8px;justify-content:center;margin:16px 0"><button class="btn btn-sm btn-s" onclick="closeLevSel()">RETOUR</button></div>`;
  inner.innerHTML=html;
}

// ================================================================
// DEBUG: DRAG & DROP REORDER
// ================================================================
let dbgDragIdx=-1;

function dbgDragStart(e,idx){dbgDragIdx=idx;e.target.closest('.dbg-lv').classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function dbgDragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move';}
function dbgDragEnter(e){e.preventDefault();const el=e.target.closest('.dbg-lv');if(el)el.classList.add('dragover');}
function dbgDragLeave(e){const el=e.target.closest('.dbg-lv');if(el)el.classList.remove('dragover');}
function dbgDragEnd(e){document.querySelectorAll('.dbg-lv').forEach(el=>{el.classList.remove('dragging','dragover');});}

function dbgDrop(e,toIdx){
  e.preventDefault();
  dbgDragEnd(e);
  if(dbgDragIdx===toIdx||dbgDragIdx<0) return;
  // Déplacer le niveau
  const lv=LEVELS.splice(dbgDragIdx,1)[0];
  LEVELS.splice(toIdx,0,lv);
  saveAllLevels();
  showDebugLevelManager(document.getElementById('levsel-inner'));
}

// Touch reorder pour mobile
let dbgTouchIdx=-1, dbgTouchEl=null, dbgTouchY=0;
function dbgTouchStart(e,idx){
  dbgTouchIdx=idx;
  dbgTouchY=e.touches[0].clientY;
  dbgTouchEl=e.target.closest('.dbg-lv');
  dbgTouchEl.classList.add('dragging');
  
  const onMove=(ev)=>{
    ev.preventDefault();
    const dy=ev.touches[0].clientY-dbgTouchY;
    if(dbgTouchEl)dbgTouchEl.style.transform=`translateY(${dy}px)`;
  };
  const onEnd=(ev)=>{
    document.removeEventListener('touchmove',onMove);
    document.removeEventListener('touchend',onEnd);
    if(!dbgTouchEl)return;
    dbgTouchEl.classList.remove('dragging');
    dbgTouchEl.style.transform='';
    
    const dy=ev.changedTouches[0].clientY-dbgTouchY;
    const steps=Math.round(dy/50); // ~50px per item
    const toIdx=Math.max(0,Math.min(LEVELS.length-1,dbgTouchIdx+steps));
    if(toIdx!==dbgTouchIdx){
      const lv=LEVELS.splice(dbgTouchIdx,1)[0];
      LEVELS.splice(toIdx,0,lv);
      saveAllLevels();
      showDebugLevelManager(document.getElementById('levsel-inner'));
    }
    dbgTouchEl=null;
  };
  document.addEventListener('touchmove',onMove,{passive:false});
  document.addEventListener('touchend',onEnd);
}

function generateProceduralLevel(diff){
  diff=diff||'medium';
  const allTypes=['normal','accelerator','repulsive','orbital','slow','pulsar','moon'];
  
  // Paramètres selon difficulté
  const cfg={
    easy:{minPlanets:2,maxPlanets:4,minSize:25,maxSize:50,maxTypes:5,strengthMod:0.7},
    medium:{minPlanets:3,maxPlanets:6,minSize:15,maxSize:40,maxTypes:7,strengthMod:1.0},
    hard:{minPlanets:5,maxPlanets:9,minSize:10,maxSize:25,maxTypes:7,strengthMod:1.3}
  }[diff];
  
  const availTypes=allTypes.slice(0,cfg.maxTypes);
  
  const cometPositions=[
    {x:0.5,y:0.85},{x:0.2,y:0.85},{x:0.8,y:0.85},
    {x:0.3,y:0.85},{x:0.7,y:0.85},{x:0.15,y:0.85},{x:0.85,y:0.85}
  ];
  const bhPositions=[
    {x:0.5,y:0.1},{x:0.2,y:0.1},{x:0.8,y:0.1},
    {x:0.3,y:0.12},{x:0.7,y:0.12},{x:0.15,y:0.1},{x:0.85,y:0.1}
  ];
  
  const comet=cometPositions[Math.floor(Math.random()*cometPositions.length)];
  const bh=bhPositions[Math.floor(Math.random()*bhPositions.length)];
  
  const numPlanets=cfg.minPlanets+Math.floor(Math.random()*(cfg.maxPlanets-cfg.minPlanets+1));
  
  const planets=[];
  for(let i=0;i<numPlanets;i++){
    const t=(i+1)/(numPlanets+1);
    const baseY=comet.y-t*(comet.y-bh.y);
    const spreadX=0.15+Math.random()*0.3;
    const baseX=0.2+Math.random()*0.6;
    
    const size=Math.round(cfg.minSize+Math.random()*(cfg.maxSize-cfg.minSize));
    const sizeRatio=1-((size-10)/70);
    const strength=Math.round((60+sizeRatio*240)*cfg.strengthMod);
    const type=availTypes[Math.floor(Math.random()*availTypes.length)];
    
    planets.push({
      x:Math.max(0.1,Math.min(0.9,baseX+(Math.random()-0.5)*spreadX)),
      y:Math.max(0.15,Math.min(0.8,baseY+(Math.random()-0.5)*0.1)),
      size, type, strength
    });
  }
  
  LEVELS.push({comet,blackHole:bh,planets});
  saveAllLevels();
  showDebugLevelManager(document.getElementById('levsel-inner'));
  setTimeout(()=>{document.getElementById('levsel-inner').scrollTop=999999;},50);
}

function getP(e){return e.touches?{x:e.touches[0].clientX,y:e.touches[0].clientY}:{x:e.clientX,y:e.clientY};}
function onS(e){if(!G.playing||G.flying||G.win)return;e.preventDefault();const p=getP(e);drag={on:true,sx:p.x,sy:p.y,cx:p.x,cy:p.y};document.getElementById('hint').style.opacity='0';}
function onM(e){if(!drag.on)return;e.preventDefault();const p=getP(e);drag.cx=p.x;drag.cy=p.y;}
function onE(e){if(!drag.on)return;e.preventDefault();drag.on=false;const dx=drag.sx-drag.cx,dy=drag.sy-drag.cy,d=Math.sqrt(dx*dx+dy*dy);if(d<15)return;const pw=Math.min(d*.08,12),a=Math.atan2(dy,dx);comet.vx=Math.cos(a)*pw;comet.vy=Math.sin(a)*pw;G.flying=true;G.launches++;updateUI();}

C.addEventListener('touchstart',onS,{passive:false});

// ================================================================
// PHYSICS
// ================================================================
function physics(){
  if(!G.flying||!comet.alive) return;
  
  for(const p of planets){
    const dx=p.x-comet.x, dy=p.y-comet.y;
    const dsq=dx*dx+dy*dy, d=Math.sqrt(dsq);
    
    if(d<p.size+comet.r){cometDie(p);return;}
    if(d<p.size+comet.r+25&&d>p.size+comet.r+5){comet.nm++;spawnNM(comet.x,comet.y);}
    
    const f=p.strength/dsq;
    
    switch(p.type){
      case'normal':comet.vx+=(dx/d)*f*1.15;comet.vy+=(dy/d)*f*1.15;break;
      case'accelerator':comet.vx+=(dx/d)*f*1.1;comet.vy+=(dy/d)*f*1.1;if(d<p.size+80){comet.vx*=1.01;comet.vy*=1.01;}break;
      case'repulsive':comet.vx-=(dx/d)*f;comet.vy-=(dy/d)*f;break;
      case'orbital':comet.vx+=(dx/d)*f*1.8;comet.vy+=(dy/d)*f*1.8;break;
      case'slow':comet.vx+=(dx/d)*f*1.15;comet.vy+=(dy/d)*f*1.15;if(d<p.size+100){comet.vx*=.9933;comet.vy*=.9933;}break;
      case'pulsar':comet.vx+=(dx/d)*f*0.3;comet.vy+=(dy/d)*f*0.3;{const ja=p.pulsarAngle,jl=p.size+60,jw=8;const jx1=p.x+Math.cos(ja)*jl,jy1=p.y+Math.sin(ja)*jl;const jx2=p.x+Math.cos(ja+Math.PI)*jl,jy2=p.y+Math.sin(ja+Math.PI)*jl;const _ps=function(px,py,ax,ay,bx,by){const abx=bx-ax,aby=by-ay,apx=px-ax,apy=py-ay;let t=(apx*abx+apy*aby)/(abx*abx+aby*aby);t=Math.max(0,Math.min(1,t));const cx=ax+t*abx,cy=ay+t*aby;return Math.sqrt((px-cx)*(px-cx)+(py-cy)*(py-cy));};if(_ps(comet.x,comet.y,p.x,p.y,jx1,jy1)<jw||_ps(comet.x,comet.y,p.x,p.y,jx2,jy2)<jw){cometDie(p);return;}}break;
      case'moon':comet.vx+=(dx/d)*f;comet.vy+=(dy/d)*f;{const ma=p.moonAngle||0,md=p.size+33,mx=p.x+Math.cos(ma)*md,my=p.y+Math.sin(ma)*md,mr=7;const mf=80/((comet.x-mx)*(comet.x-mx)+(comet.y-my)*(comet.y-my));const mdx=mx-comet.x,mdy=my-comet.y,mdd=Math.sqrt(mdx*mdx+mdy*mdy);comet.vx+=(mdx/mdd)*mf*0.5;comet.vy+=(mdy/mdd)*mf*0.5;if(mdd<mr+comet.r){cometDie(p);return;}}break;
    }
  }
  
  // Téléportation trou de ver (bidirectionnelle)
  if(wormholes&&wormholes.length){for(let wi=0;wi<wormholes.length;wi++){const w=wormholes[wi];if(!w||w.cd>0){if(w)w.cd--;continue;}const d1=Math.sqrt((comet.x-w.x1)*(comet.x-w.x1)+(comet.y-w.y1)*(comet.y-w.y1));const d2=Math.sqrt((comet.x-w.x2)*(comet.x-w.x2)+(comet.y-w.y2)*(comet.y-w.y2));if(d1<15){comet.x=w.x2;comet.y=w.y2;w.cd=30;for(let i=0;i<12;i++)particles.push({x:w.x2,y:w.y2,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,l:1,d:.03+Math.random()*.02,s:Math.random()*3+1,c:'#a855f7'});break;}if(d2<15){comet.x=w.x1;comet.y=w.y1;w.cd=30;for(let i=0;i<12;i++)particles.push({x:w.x1,y:w.y1,vx:(Math.random()-.5)*3,vy:(Math.random()-.5)*3,l:1,d:.03+Math.random()*.02,s:Math.random()*3+1,c:'#00ffff'});break;}}}
  
  // Black hole
  const bx=blackHole.x-comet.x,by=blackHole.y-comet.y,bd=Math.sqrt(bx*bx+by*by);
  if(bd<200){const bf=80/(bd*bd);comet.vx+=(bx/bd)*bf;comet.vy+=(by/bd)*bf;}
  if(bd<blackHole.r+5){cometWin();return;}
  
  comet.x+=comet.vx; comet.y+=comet.vy;
  comet.trail.push({x:comet.x,y:comet.y});
  if(comet.trail.length>60) comet.trail.shift();
  
  if(Math.random()<.4) particles.push({x:comet.x+(Math.random()-.5)*6,y:comet.y+(Math.random()-.5)*6,vx:(Math.random()-.5)*.5-comet.vx*.1,vy:(Math.random()-.5)*.5-comet.vy*.1,l:1,d:.02+Math.random()*.02,s:Math.random()*3+1,c:Math.random()>.5?`rgba(255,255,255,${.5+Math.random()*.5})`:`rgba(125,249,255,${.5+Math.random()*.5})`});
  
  // Rebond sur les bords de l'écran (la comète ne sort jamais)
  // Sortie d'écran = comète détruite, pas de rebond
  if(comet.x<-5||comet.x>W+5||comet.y<-5||comet.y>H+5) cometDie(null);
  
  // Si la comète est quasi arrêtée après rebonds, elle est perdue
  const speed=Math.sqrt(comet.vx*comet.vx+comet.vy*comet.vy);
  if(speed<0.15 && G.flying){cometDie(null);}
}

function cometWin(){
  G.flying=false;G.win=true;comet.alive=false;G.shake=15;
  boom(blackHole.x,blackHole.y,'#7df9ff');boom(blackHole.x,blackHole.y,'#ffd700');
  setTimeout(()=>showMsg('win'),600);
}

function cometDie(p){
  G.flying=false;comet.alive=false;
  boom(comet.x,comet.y,p?PT[p.type].main:'#f87171');G.shake=8;
  setTimeout(()=>{if(!G.win)resetComet();},700);
}

function boom(x,y,c){for(let i=0;i<28;i++){const a=Math.random()*Math.PI*2,s=Math.random()*4+1;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,d:.015+Math.random()*.02,s:Math.random()*4+2,c});}}
function spawnNM(x,y){for(let i=0;i<4;i++)particles.push({x,y,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,l:1,d:.04,s:2,c:'#ffd700'});}

// ================================================================
// RENDERING
// ================================================================
function shadeColor(c,p){const n=parseInt(c.replace('#',''),16),a=Math.round(2.55*p);return`rgb(${Math.max(0,Math.min(255,(n>>16)+a))},${Math.max(0,Math.min(255,((n>>8)&0xFF)+a))},${Math.max(0,Math.min(255,(n&0xFF)+a))})`;}
function hexA(h,a){if(!h||!h.startsWith('#'))return`rgba(255,255,255,${a})`;const n=parseInt(h.replace('#',''),16);return`rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;}

function render(){
  time++;
  if(G.shake>0){G.sx=(Math.random()-.5)*G.shake;G.sy=(Math.random()-.5)*G.shake;G.shake*=.9;if(G.shake<.5)G.shake=0;}else{G.sx=0;G.sy=0;}
  
  X.save(); X.translate(G.sx,G.sy);
  
  // BG
  const bg=X.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.max(W,H)*.7);
  bg.addColorStop(0,'#0d1b2a');bg.addColorStop(.5,'#0a0f1a');bg.addColorStop(1,'#050510');
  X.fillStyle=bg;X.fillRect(0,0,W,H);
  for(const s of bgStars){const sx=(s.x/1e3)*W,sy=(s.y/1e3)*H,a=s.a*(.7+.3*Math.sin(time*s.ts+s.tp));X.beginPath();X.arc(sx,sy,s.s,0,Math.PI*2);X.fillStyle=`rgba(200,220,255,${a})`;X.fill();}
  
  if(G.playing){
    // Update pulsar/moon angles
    for(const p of planets){
      if(p.type==='pulsar'){if(p.pulsarAngle===undefined)p.pulsarAngle=0;p.pulsarAngle+=0.025;}
      if(p.type==='moon'){if(p.moonAngle===undefined)p.moonAngle=Math.random()*Math.PI*2;p.moonAngle+=0.012;}
    }
    // Planets
    for(const p of planets){
      const col=PT[p.type];
      const isNormalImg=p.type==='normal'&&planetNormalImg.complete;
      const isAccelImg=p.type==='accelerator'&&planetAccelImg.complete;
      const isRepulImg=p.type==='repulsive'&&planetRepulImg.complete;
      const isOrbitalImg=p.type==='orbital'&&planetOrbitalImg.complete;
      const isSlowImg=p.type==='slow'&&planetSlowImg.complete;
      const isMoonImg=p.type==='moon'&&planetMoonImg.complete;
      const isPulsarImg=p.type==='pulsar'&&pulsarCoreImgReady;
      const isPlanetImg=isNormalImg||isAccelImg||isRepulImg||isOrbitalImg||isSlowImg||isMoonImg||isPulsarImg;
      if(!isPlanetImg) p.pp+=.03;
      const pulse=isPlanetImg?1:(1+Math.sin(p.pp)*.05), sz=p.size*pulse;
      
      // Glow
      const fg=X.createRadialGradient(p.x,p.y,sz,p.x,p.y,sz*(isPlanetImg?2:3));
      fg.addColorStop(0,col.glow);fg.addColorStop(1,'transparent');
      X.beginPath();X.arc(p.x,p.y,sz*(isPlanetImg?2:3),0,Math.PI*2);X.fillStyle=fg;X.fill();
      
      if(isPlanetImg){

      }else{

function autoSolve(){
  if(!G.playing) return;
  // Reset comet d'abord
  resetComet();
  
  const lv=LEVELS[G.level];
  const cx=lv.comet.x*W, cy=lv.comet.y*H;
  const bx=lv.blackHole.x*W, by=lv.blackHole.y*H;
  const pls=lv.planets.map(p=>({x:p.x*W,y:p.y*H,size:p.size*SC,type:p.type,strength:p.strength}));
  
  // Simuler plein de trajectoires et trouver celle qui arrive le plus près du trou noir
  let bestAngle=0, bestPower=0, bestDist=Infinity;
  
  for(let ai=0;ai<360;ai+=2){
    for(let pw=2;pw<=12;pw+=0.5){
      const angle=ai*Math.PI/180;
      let sx=cx, sy=cy;
      let svx=Math.cos(angle)*pw, svy=Math.sin(angle)*pw;
      let minD=Infinity;
      
      for(let step=0;step<500;step++){
        // Gravité des planètes
        for(const p of pls){
          const dx=p.x-sx, dy=p.y-sy;
          const dsq=dx*dx+dy*dy, d=Math.sqrt(dsq);
          if(d<p.size+8){minD=Infinity;step=999;break;} // collision planète
          const f=p.strength/dsq;
          switch(p.type){
            case'normal':svx+=(dx/d)*f*1.15;svy+=(dy/d)*f*1.15;break;
            case'accelerator':svx+=(dx/d)*f*1.1;svy+=(dy/d)*f*1.1;if(d<p.size+80){svx*=1.01;svy*=1.01;}break;
            case'repulsive':svx-=(dx/d)*f;svy-=(dy/d)*f;break;
            case'orbital':svx+=(dx/d)*f*1.8;svy+=(dy/d)*f*1.8;break;
            case'slow':svx+=(dx/d)*f*1.15;svy+=(dy/d)*f*1.15;if(d<p.size+100){svx*=.9933;svy*=.9933;}break;
          }
        }
        // Gravité trou noir
        const bdx=bx-sx,bdy=by-sy,bd=Math.sqrt(bdx*bdx+bdy*bdy);
        if(bd<200){const bf=80/(bd*bd);svx+=(bdx/bd)*bf;svy+=(bdy/bd)*bf;}
        
        sx+=svx; sy+=svy;
        
        const dd=Math.sqrt((sx-bx)*(sx-bx)+(sy-by)*(sy-by));
        if(dd<minD) minD=dd;
        if(dd<25){minD=0;break;} // touché !
        
        // Hors écran
        if(sx<-5||sx>W+5||sy<-5||sy>H+5) break;
      }
      
      if(minD<bestDist){bestDist=minD;bestAngle=angle;bestPower=pw;}
      if(bestDist===0) break;
    }
    if(bestDist===0) break;
  }
  
  if(bestDist>50){
    // Pas de solution trouvée, essayer plus finement autour de la direction vers le trou noir
    const directAngle=Math.atan2(by-cy,bx-cx);
    for(let ai=-60;ai<=60;ai+=0.5){
      for(let pw=1;pw<=12;pw+=0.3){
        const angle=directAngle+ai*Math.PI/180;
        let sx=cx,sy=cy,svx=Math.cos(angle)*pw,svy=Math.sin(angle)*pw;
        let minD=Infinity;
        for(let step=0;step<600;step++){
          for(const p of pls){
            const dx=p.x-sx,dy=p.y-sy,dsq=dx*dx+dy*dy,d=Math.sqrt(dsq);
            if(d<p.size+8){minD=Infinity;step=999;break;}
            const f=p.strength/dsq;
            switch(p.type){
              case'normal':svx+=(dx/d)*f*1.15;svy+=(dy/d)*f*1.15;break;
              case'accelerator':svx+=(dx/d)*f*1.1;svy+=(dy/d)*f*1.1;if(d<p.size+80){svx*=1.01;svy*=1.01;}break;
              case'repulsive':svx-=(dx/d)*f;svy-=(dy/d)*f;break;
              case'orbital':svx+=(dx/d)*f*1.8;svy+=(dy/d)*f*1.8;break;
              case'slow':svx+=(dx/d)*f*1.15;svy+=(dy/d)*f*1.15;if(d<p.size+100){svx*=.9933;svy*=.9933;}break;
            }
          }
          const bdx=bx-sx,bdy=by-sy,bd=Math.sqrt(bdx*bdx+bdy*bdy);
          if(bd<200){const bf=80/(bd*bd);svx+=(bdx/bd)*bf;svy+=(bdy/bd)*bf;}
          sx+=svx;sy+=svy;
          const dd=Math.sqrt((sx-bx)*(sx-bx)+(sy-by)*(sy-by));
          if(dd<minD)minD=dd;
          if(dd<25){minD=0;break;}
          if(sx<-5||sx>W+5||sy<-5||sy>H+5)break;
        }
        if(minD<bestDist){bestDist=minD;bestAngle=angle;bestPower=pw;}
        if(bestDist===0)break;
      }
      if(bestDist===0)break;
    }
  }
  
  // Lancer la comète avec la meilleure trajectoire trouvée
  comet.vx=Math.cos(bestAngle)*bestPower;
  comet.vy=Math.sin(bestAngle)*bestPower;
  G.flying=true;
  G.launches++;
  updateUI();
  
  // Afficher un indicateur
  const hint=document.getElementById('hint');
  hint.textContent=bestDist===0?'🤖 Solution trouvée !':'🤖 Meilleure tentative (dist: '+Math.round(bestDist)+')';
  hint.style.opacity='1';
  setTimeout(()=>{hint.style.opacity='0';},2000);
}

// Enable toolbar horizontal scroll on touch
(function(){

  tb.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sl=tb.scrollLeft;dragging=true;e.stopPropagation();},{passive:true});

function initEdCanvas(){
  if(!eC)return;
  const w=document.getElementById('ed-canvas-wrap');
  const r=w.getBoundingClientRect();
  eC.width=r.width*devicePixelRatio; eC.height=r.height*devicePixelRatio;
  eC.style.width=r.width+'px'; eC.style.height=r.height+'px';
  eX.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
  
  eC.removeEventListener('touchstart',edTS);eC.removeEventListener('touchmove',edTM);eC.removeEventListener('touchend',edTE);
  eC.removeEventListener('mousedown',edMS);eC.removeEventListener('mousemove',edMM);eC.removeEventListener('mouseup',edME);
  eC.addEventListener('touchstart',edTS,{passive:false});eC.addEventListener('touchmove',edTM,{passive:false});eC.addEventListener('touchend',edTE,{passive:false});
  eC.addEventListener('mousedown',edMS);eC.addEventListener('mousemove',edMM);eC.addEventListener('mouseup',edME);
}

function edHit(mx,my){
  if(edData.comet){const dx=mx-edData.comet.x,dy=my-edData.comet.y;if(Math.sqrt(dx*dx+dy*dy)<20)return{type:'comet'};}
  if(edData.blackHole){const dx=mx-edData.blackHole.x,dy=my-edData.blackHole.y;if(Math.sqrt(dx*dx+dy*dy)<30)return{type:'blackhole'};}
  for(let i=edData.planets.length-1;i>=0;i--){const p=edData.planets[i],dx=mx-p.x,dy=my-p.y;if(Math.sqrt(dx*dx+dy*dy)<p.size+10)return{type:'planet',index:i};}
  if(edData.wormholes){for(let i=edData.wormholes.length-1;i>=0;i--){const w=edData.wormholes[i];const d1=Math.sqrt((mx-w.x1)*(mx-w.x1)+(my-w.y1)*(my-w.y1));const d2=Math.sqrt((mx-w.x2)*(mx-w.x2)+(my-w.y2)*(my-w.y2));if(d1<20)return{type:'wormhole',index:i,portal:1};if(d2<20)return{type:'wormhole',index:i,portal:2};}}
  return null;
}

function edDown(x,y){
  const w=document.getElementById('ed-canvas-wrap');const r=w.getBoundingClientRect();
  const mx=x-r.left,my=y-r.top;
  
  if(edTool==='select'){
    const hit=edHit(mx,my);
    if(hit){edSel=hit;edDrag=true;const o=edGetObj();if(o)edOff={x:mx-o.x,y:my-o.y};edShowProps();}
    else{edSel=null;edDrag=false;edPan=true;edLastY=my;document.getElementById('ed-props').classList.remove('show');}
  }else if(edTool==='delete'){
    const hit=edHit(mx,my);
    if(hit){if(hit.type==='comet')edData.comet=null;else if(hit.type==='blackhole')edData.blackHole=null;else if(hit.type==='wormhole')edData.wormholes.splice(hit.index,1);else edData.planets.splice(hit.index,1);edSel=null;document.getElementById('ed-props').classList.remove('show');autoSave();}
  }else if(edTool==='comet'){edData.comet={x:mx,y:my};edSel={type:'comet'};edDrag=true;edOff={x:0,y:0};edShowProps();edSelTool('select');autoSave();
  }else if(edTool==='blackhole'){edData.blackHole={x:mx,y:my};edSel={type:'blackhole'};edDrag=true;edOff={x:0,y:0};edShowProps();edSelTool('select');autoSave();
  }else if(edTool==='wormhole'){
    if(!edWormPending){edWormPending={x:mx,y:my};}else{if(!edData.wormholes)edData.wormholes=[];edData.wormholes.push({x1:edWormPending.x,y1:edWormPending.y,x2:mx,y2:my});edSel={type:'wormhole',index:edData.wormholes.length-1,portal:2};edWormPending=null;edShowProps();edSelTool('select');autoSave();}
  }else if(PT[edTool]){
    edData.planets.push({x:mx,y:my,size:30*SC,type:edTool,strength:163,origSize:30});
    edSel={type:'planet',index:edData.planets.length-1};edDrag=true;edOff={x:0,y:0};edShowProps();edSelTool('select');autoSave();
  }
}

function edMove(x,y){
  const w=document.getElementById('ed-canvas-wrap');const r=w.getBoundingClientRect();
  const mx=x-r.left,my=y-r.top;
  if(edDrag&&edSel){const o=edGetObj();if(o){o.x=Math.max(0,Math.min(W,mx-edOff.x));o.y=Math.max(0,Math.min(H,my-edOff.y));edShowProps();}}
}

function edUp(){edDrag=false;edPan=false;autoSave();}
function edGetObj(){if(!edSel)return null;if(edSel.type==='comet')return edData.comet;if(edSel.type==='blackhole')return edData.blackHole;if(edSel.type==='planet')return edData.planets[edSel.index];if(edSel.type==='wormhole'){const w=edData.wormholes[edSel.index];return edSel.portal===1?{get x(){return w.x1},set x(v){w.x1=v},get y(){return w.y1},set y(v){w.y1=v}}:{get x(){return w.x2},set x(v){w.x2=v},get y(){return w.y2},set y(v){w.y2=v}};}return null;}

function edTS(e){e.preventDefault();edDown(e.touches[0].clientX,e.touches[0].clientY);}
function edTM(e){e.preventDefault();edMove(e.touches[0].clientX,e.touches[0].clientY);}
function edTE(e){e.preventDefault();edUp();}
function edMS(e){edDown(e.clientX,e.clientY);}
function edMM(e){edMove(e.clientX,e.clientY);}
function edME(e){edUp();}

  if(edSel.type==='planet'){

    content.innerHTML=`
      <div class="pr"><span class="pr-l">Taille</span><div class="pr-sw"><input type="range" class="pr-s" min="10" max="80" value="${p.origSize||Math.round(p.size/SC)}" oninput="edUpdP('size',this.value)"><span class="pr-v" id="epv-size">${p.origSize||Math.round(p.size/SC)}</span></div></div>
      <div class="pr"><span class="pr-l">Effet</span><span class="pr-v" id="epv-str" style="color:#fbbf24">${p.strength} ⚡</span><span class="pr-v" style="font-size:8px;color:rgba(255,255,255,0.35);min-width:auto;margin-left:6px">auto</span></div>
      <div class="pr"><span class="pr-l">Type</span><div style="display:flex;gap:3px;flex-wrap:wrap">${Object.keys(PT).map(t=>`<button class="btn btn-sm" style="padding:3px 6px;font-size:8px;${p.type===t?'background:'+PT[t].main+';color:#000;':''}" onclick="edChgType('${t}')">${t.slice(0,4)}</button>`).join('')}</div></div>
      <div style="text-align:center;margin-top:6px"><button class="btn btn-sm btn-d" onclick="edData.planets.splice(${edSel.index},1);edSel=null;document.getElementById('ed-props').classList.remove('show');autoSave()">Supprimer</button></div>`;

    content.innerHTML=`<div class="pr"><span class="pr-l">Portail A</span><span class="pr-v">${Math.round(w.x1)}, ${Math.round(w.y1)}</span></div>

      <div style="text-align:center;margin-top:6px"><button class="btn btn-sm btn-d" onclick="edData.wormholes.splice(${edSel.index},1);edSel=null;document.getElementById('ed-props').classList.remove('show');autoSave()">Supprimer la paire</button></div>`;

    content.innerHTML=`<div class="pr"><span class="pr-l">Position</span><span class="pr-v">${Math.round(o.x)}, ${Math.round(o.y)}</span></div>
      <div style="text-align:center;margin-top:6px"><button class="btn btn-sm btn-d" onclick="edData.${edSel.type==='comet'?'comet':'blackHole'}=null;edSel=null;document.getElementById('ed-props').classList.remove('show');autoSave()">Supprimer</button></div>`;
  }
}

function edUpdP(prop,val){
  const p=edData.planets[edSel.index]; const v=parseInt(val);
  // Taille contrôle tout : plus petit = plus puissant
  p.origSize=v;
  p.size=v*SC;
  const sizeRatio = 1 - ((v - 10) / 70); // 1 pour size=10, 0 pour size=80
  p.strength = Math.round(60 + sizeRatio * 240); // 60 (gros) à 300 (petit)
  document.getElementById('epv-size').textContent=v;
  document.getElementById('epv-str').textContent=p.strength;
  autoSave();
}

function edChgType(t){edData.planets[edSel.index].type=t;edShowProps();autoSave();}

function edLoop(){
  if(!document.getElementById('editor').classList.contains('show'))return;
  edTime++;initEdCanvas();
  const w=document.getElementById('ed-canvas-wrap');const r=w.getBoundingClientRect();const vw=r.width,vh=r.height;
  
  eX.fillStyle='#080810';eX.fillRect(0,0,vw,vh);
  
  // Grid
  eX.strokeStyle='rgba(125,249,255,0.04)';eX.lineWidth=.5;
  for(let x=0;x<vw;x+=50){eX.beginPath();eX.moveTo(x,0);eX.lineTo(x,vh);eX.stroke();}
  for(let y=0;y<vh;y+=50){eX.beginPath();eX.moveTo(0,y);eX.lineTo(vw,y);eX.stroke();}
  
  // Planets
  for(let i=0;i<edData.planets.length;i++){
    const p=edData.planets[i];const col=PT[p.type];const isSel=edSel&&edSel.type==='planet'&&edSel.index===i;
    const fg=eX.createRadialGradient(p.x,p.y,p.size,p.x,p.y,p.size*2.5);fg.addColorStop(0,col.glow);fg.addColorStop(1,'transparent');
    eX.beginPath();eX.arc(p.x,p.y,p.size*2.5,0,Math.PI*2);eX.fillStyle=fg;eX.fill();
    if(p.type==='pulsar'&&pulsarCoreImgReady){eX.drawImage(pulsarCoreImg,p.x-p.size,p.y-p.size,p.size*2,p.size*2);}else{const bg=eX.createRadialGradient(p.x-p.size*.3,p.y-p.size*.3,p.size*.1,p.x,p.y,p.size);
    bg.addColorStop(0,'#fff');bg.addColorStop(.4,col.main);bg.addColorStop(1,shadeColor(col.main,-40));
    eX.beginPath();eX.arc(p.x,p.y,p.size,0,Math.PI*2);eX.fillStyle=bg;eX.fill();}
    if(isSel){eX.beginPath();eX.arc(p.x,p.y,p.size+6,0,Math.PI*2);eX.strokeStyle='#fff';eX.lineWidth=1.5;eX.setLineDash([4,4]);eX.stroke();eX.setLineDash([]);}
    eX.fillStyle='rgba(255,255,255,0.45)';eX.font='9px "Exo 2"';eX.textAlign='center';
    eX.fillText(`${p.origSize||'?'}px/${p.strength}g`,p.x,p.y+p.size+14);
  }
  
  // Black hole
  if(edData.blackHole){
    const b=edData.blackHole;const br=22;
    eX.save();eX.translate(b.x,b.y);eX.rotate(edTime*.01);eX.beginPath();eX.ellipse(0,0,br*2,br*.7,0,0,Math.PI*2);eX.strokeStyle='rgba(125,249,255,0.2)';eX.lineWidth=1.5;eX.stroke();eX.restore();
    if(blackHoleCoreImgReady){eX.save();eX.beginPath();eX.arc(b.x,b.y,br,0,Math.PI*2);eX.clip();eX.translate(b.x,b.y);eX.rotate(edTime*0.015);eX.drawImage(blackHoleCoreImg,-br,-br,br*2,br*2);eX.restore();}else{const ig=eX.createRadialGradient(b.x,b.y,0,b.x,b.y,br);ig.addColorStop(0,'#000');ig.addColorStop(.8,'#050510');ig.addColorStop(1,'rgba(125,249,255,0.4)');eX.beginPath();eX.arc(b.x,b.y,br,0,Math.PI*2);eX.fillStyle=ig;eX.fill();}
    eX.beginPath();eX.arc(b.x,b.y,br+1,0,Math.PI*2);eX.strokeStyle='rgba(125,249,255,0.08)';eX.lineWidth=0.5;eX.stroke();
    if(edSel&&edSel.type==='blackhole'){eX.beginPath();eX.arc(b.x,b.y,br+8,0,Math.PI*2);eX.strokeStyle='#fff';eX.lineWidth=1.5;eX.setLineDash([4,4]);eX.stroke();eX.setLineDash([]);}
  }
  
  // Comet
  if(edData.comet){
    const c=edData.comet;const cr=8;
    const cg=eX.createRadialGradient(c.x,c.y,0,c.x,c.y,cr*3);cg.addColorStop(0,'rgba(125,249,255,0.3)');cg.addColorStop(1,'transparent');
    eX.beginPath();eX.arc(c.x,c.y,cr*3,0,Math.PI*2);eX.fillStyle=cg;eX.fill();
    const cb=eX.createRadialGradient(c.x-2,c.y-2,1,c.x,c.y,cr);cb.addColorStop(0,'#fff');cb.addColorStop(.5,'#7df9ff');cb.addColorStop(1,'#00b4d8');
    eX.beginPath();eX.arc(c.x,c.y,cr,0,Math.PI*2);eX.fillStyle=cb;eX.fill();
    if(edSel&&edSel.type==='comet'){eX.beginPath();eX.arc(c.x,c.y,cr+8,0,Math.PI*2);eX.strokeStyle='#fff';eX.lineWidth=1.5;eX.setLineDash([4,4]);eX.stroke();eX.setLineDash([]);}
  }
  
  // Wormholes
  if(edData.wormholes){for(let i=0;i<edData.wormholes.length;i++){const w=edData.wormholes[i];const isSel=edSel&&edSel.type==='wormhole'&&edSel.index===i;
    eX.beginPath();eX.setLineDash([4,8]);eX.moveTo(w.x1,w.y1);eX.lineTo(w.x2,w.y2);eX.strokeStyle='rgba(168,85,247,0.2)';eX.lineWidth=1;eX.stroke();eX.setLineDash([]);
    [[w.x1,w.y1,1],[w.x2,w.y2,2]].forEach(([px,py,pn])=>{
      const ws=11;
      // Glow
      const wg=eX.createRadialGradient(px,py,ws,px,py,ws*3);wg.addColorStop(0,'rgba(168,85,247,0.15)');wg.addColorStop(1,'transparent');
      eX.beginPath();eX.arc(px,py,ws*3,0,Math.PI*2);eX.fillStyle=wg;eX.fill();
      // Ellipse
      eX.save();eX.translate(px,py);eX.rotate(edTime*0.015*(pn===1?1:-1));eX.beginPath();eX.ellipse(0,0,ws*2.2,ws*.8,0,0,Math.PI*2);eX.strokeStyle='rgba(200,180,255,0.25)';eX.lineWidth=1;eX.stroke();eX.restore();
      // Core
      if(wormholeCoreImgReady){eX.save();eX.translate(px,py);eX.rotate(edTime*0.02);eX.beginPath();eX.arc(0,0,ws,0,Math.PI*2);eX.clip();eX.drawImage(wormholeCoreImg,-ws,-ws,ws*2,ws*2);eX.restore();}else{const wig=eX.createRadialGradient(px,py,0,px,py,ws);wig.addColorStop(0,'#fff');wig.addColorStop(.4,'#d8b4fe');wig.addColorStop(.8,'#7c3aed');wig.addColorStop(1,'rgba(168,85,247,0.5)');eX.beginPath();eX.arc(px,py,ws,0,Math.PI*2);eX.fillStyle=wig;eX.fill();}
      // Border
      eX.beginPath();eX.arc(px,py,ws+1,0,Math.PI*2);eX.strokeStyle='rgba(200,180,255,0.4)';eX.lineWidth=1;eX.stroke();
      // Label
      eX.fillStyle='rgba(255,255,255,0.4)';eX.font='8px "Exo 2"';eX.textAlign='center';eX.fillText(pn===1?'A':'B',px,py+ws+12);
      if(isSel&&edSel.portal===pn){eX.beginPath();eX.arc(px,py,18,0,Math.PI*2);eX.strokeStyle='#fff';eX.lineWidth=1.5;eX.setLineDash([4,4]);eX.stroke();eX.setLineDash([]);}
    });
  }}
  // Pending wormhole portal
  if(edWormPending){const px=edWormPending.x,py=edWormPending.y,ws=11;if(wormholeCoreImgReady){eX.save();eX.translate(px,py);eX.rotate(edTime*0.02);eX.beginPath();eX.arc(0,0,ws,0,Math.PI*2);eX.clip();eX.drawImage(wormholeCoreImg,-ws,-ws,ws*2,ws*2);eX.restore();}else{const wig=eX.createRadialGradient(px,py,0,px,py,ws);wig.addColorStop(0,'#fff');wig.addColorStop(.5,'#d8b4fe');wig.addColorStop(1,'rgba(168,85,247,0.3)');eX.beginPath();eX.arc(px,py,ws,0,Math.PI*2);eX.fillStyle=wig;eX.fill();}eX.beginPath();eX.arc(px,py,ws+2,0,Math.PI*2);eX.strokeStyle='rgba(200,180,255,0.5)';eX.lineWidth=1.5;eX.setLineDash([3,3]);eX.stroke();eX.setLineDash([]);eX.fillStyle='rgba(255,255,255,0.4)';eX.font='9px "Exo 2"';eX.textAlign='center';eX.fillText('A — Placez B',px,py+ws+14);}
  
  requestAnimationFrame(edLoop);
}

function autoSave(){
  if(edLv<0||!edData||!edData.comet||!edData.blackHole) return;
  
  const saved={
    comet:{x:edData.comet.x/W,y:edData.comet.y/H},
    blackHole:{x:edData.blackHole.x/W,y:edData.blackHole.y/H},
    planets:edData.planets.map(p=>({x:p.x/W,y:p.y/H,size:p.origSize||Math.round(p.size/SC),type:p.type,strength:p.strength})),
    wormholes:(edData.wormholes||[]).map(w=>({x1:w.x1/W,y1:w.y1/H,x2:w.x2/W,y2:w.y2/H})),
  };
  if(LEVELS[edLv]&&LEVELS[edLv].d){saved.d=LEVELS[edLv].d;saved.dt=LEVELS[edLv].dt;}
  LEVELS[edLv]=saved;
  saveAllLevels();
  saveCustomLevels();
}

function saveFromEditor(){
  if(!edData.comet||!edData.blackHole){alert('Placez comète + trou noir !');return;}
  const saved={
    comet:{x:edData.comet.x/W,y:edData.comet.y/H},
    blackHole:{x:edData.blackHole.x/W,y:edData.blackHole.y/H},
    planets:edData.planets.map(p=>({x:p.x/W,y:p.y/H,size:p.origSize||Math.round(p.size/SC),type:p.type,strength:p.strength})),
    wormholes:(edData.wormholes||[]).map(w=>({x1:w.x1/W,y1:w.y1/H,x2:w.x2/W,y2:w.y2/H})),
  };
  if(LEVELS[edLv]&&LEVELS[edLv].d){saved.d=LEVELS[edLv].d;saved.dt=LEVELS[edLv].dt;}
  LEVELS[edLv]=saved;
  saveAllLevels();
  saveCustomLevels();
  const n=document.getElementById('ed-name');
  n.textContent='✅ SAUVEGARDÉ !';n.style.color='#4ade80';
  setTimeout(()=>{n.textContent=`Niveau ${edLv+1}`;n.style.color='#7df9ff';},1500);
}

function testFromEditor(){
  document.getElementById('editor').classList.remove('show');
  document.getElementById('ed-props').classList.remove('show');
  // LEVELS est déjà à jour grâce à autoSave
  loadLevel(edLv);
}

function saveCustomLevels(){
  try{
    // Charger les customs existants
    let existing={};
    try{const d=JSON.parse(localStorage.getItem('cg_custom_levels'));if(d)existing=d;}catch(e){}
    // Sauvegarder le niveau actuel
    existing[edLv]=LEVELS[edLv];
    localStorage.setItem('cg_custom_levels',JSON.stringify(existing));
  }catch(e){console.error('Erreur sauvegarde:',e);}
}

// ================================================================
// CODE EXPORT
// ================================================================
function exportAllCode(){
  let code=`// COMET GRAVITY — ${LEVELS.length} NIVEAUX\nconst LEVELS = [\n`;
  LEVELS.forEach((lv,i)=>{
    code+=`  // Level ${i+1}${lv.d?' — DÉCOUVERTE '+lv.dt:''}\n  {\n`;
    if(lv.d) code+=`    d: true, dt: '${lv.dt}',\n`;
    code+=`    comet: { x: ${lv.comet.x.toFixed(4)}, y: ${lv.comet.y.toFixed(4)} },\n`;
    code+=`    blackHole: { x: ${lv.blackHole.x.toFixed(4)}, y: ${lv.blackHole.y.toFixed(4)} },\n`;
    code+=`    planets: [\n`;
    lv.planets.forEach(p=>{code+=`      { x: ${(typeof p.x==='number'&&p.x<=1?p.x:p.x).toFixed(4)}, y: ${(typeof p.y==='number'&&p.y<=1?p.y:p.y).toFixed(4)}, size: ${p.size}, type: '${p.type}', strength: ${p.strength} },\n`;});
    code+=`    ]`;
    if(lv.wormholes&&lv.wormholes.length){code+=`,\n    wormholes: [\n`;lv.wormholes.forEach(w=>{code+=`      { x1: ${w.x1.toFixed(4)}, y1: ${w.y1.toFixed(4)}, x2: ${w.x2.toFixed(4)}, y2: ${w.y2.toFixed(4)} },\n`;});code+=`    ]`;}
    code+=`\n  },\n`;
  });
  code+='];\n';
  
  document.getElementById('code-out').textContent=code;
  document.getElementById('codeov').classList.add('show');
}

function exportModifiedOnly(){
  let customKeys={};
  try{const d=JSON.parse(localStorage.getItem('cg_custom_levels'));if(d)customKeys=d;}catch(e){}
  
  const modified=Object.keys(customKeys);
  if(modified.length===0){alert('Aucun niveau modifié !');return;}
  
  let code='// NIVEAUX MODIFIÉS ('+modified.length+' niveaux)\nconst MODIFIED_LEVELS = {\n';
  for(const key of modified){
    const i=parseInt(key);
    const lv=LEVELS[i];
    code+=`  // Niveau ${i+1}\n  ${i}: {\n`;
    if(lv.d) code+=`    d: true, dt: '${lv.dt}',\n`;
    code+=`    comet: { x: ${lv.comet.x.toFixed(4)}, y: ${lv.comet.y.toFixed(4)} },\n`;
    code+=`    blackHole: { x: ${lv.blackHole.x.toFixed(4)}, y: ${lv.blackHole.y.toFixed(4)} },\n`;
    code+=`    planets: [\n`;
    lv.planets.forEach(p=>{code+=`      { x: ${p.x.toFixed(4)}, y: ${p.y.toFixed(4)}, size: ${p.size}, type: '${p.type}', strength: ${p.strength} },\n`;});
    code+=`    ]`;
    if(lv.wormholes&&lv.wormholes.length){code+=`,\n    wormholes: [\n`;lv.wormholes.forEach(w=>{code+=`      { x1: ${w.x1.toFixed(4)}, y1: ${w.y1.toFixed(4)}, x2: ${w.x2.toFixed(4)}, y2: ${w.y2.toFixed(4)} },\n`;});code+=`    ]`;}
    code+=`\n  },\n`;
  }
  code+='};\n';
  
  document.getElementById('code-out').textContent=code;
  document.getElementById('codeov').classList.add('show');
}

function resetAllCustom(){
  if(!confirm('Remettre les niveaux à la version validée ?\nVos modifications débug seront perdues.'))return;
  localStorage.removeItem('cg_custom_levels');
  localStorage.removeItem('cg_all_levels');
  const fresh=generateLevels();
  LEVELS.length=0;
  for(let i=0;i<fresh.length;i++) LEVELS.push(fresh[i]);

  alert('✅ Niveaux réinitialisés (version validée)');
  showLevelSelect();
}

function hideCode(){document.getElementById('codeov').classList.remove('show');}

function copyCode(){
  const code=document.getElementById('code-out').textContent;
  if(navigator.clipboard){navigator.clipboard.writeText(code).then(()=>{const b=document.querySelector('#code-foot .btn-p');b.textContent='✓ COPIÉ !';setTimeout(()=>b.textContent='📋 COPIER',1500);});}
  else{const t=document.createElement('textarea');t.value=code;t.style.cssText='position:fixed;left:-9999px';document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);const b=document.querySelector('#code-foot .btn-p');b.textContent='✓ COPIÉ !';setTimeout(()=>b.textContent='📋 COPIER',1500);}
}
